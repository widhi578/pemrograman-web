<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata</title>
</head>
<body>
    <h2>Biodata Siswa</h2>

    <form action="http://103.196.152.225:3003/submit" method="get">
        <label for="name">Nama Lengkap</label><br>
        <input type="text" id="name" name="nama" placeholder="Masukkan nama anda" required><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="Masukkan email anda" required><br><br>

        <label for="password">Password</label><br>
        <input type="password" id="password" name="password" placeholder="Masukkan password anda" required><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
