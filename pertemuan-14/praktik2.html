<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --blue-color-button: #4A90E2
        }

        .container {
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            background-color: var(--blue-color-button);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        .btn:hover {
            background-color: white;
            color: var(--blue-color-button);
            border: 2px solid var(--blue-color-button);
            transform: translateY(-20px);
            box-shadow: 0 5px 10px 5px rgba(0, 0, 0, 0.15);
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 4px solid #ddd;
            border-top: 4px solid #4A90E2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <button class="btn">KLIK AKU</button>
        <div class="spinner" style="position:absolute; display: none;"></div>
    </div>

    <script>
        const butt = document.querySelector(".btn");
        const spin = document.querySelector(".spinner");
        butt.addEventListener('click', () => {
            butt.style.display = "none"
            spin.style.display = "block"

            setTimeout(() => {
                spin.style.display = "none"
                butt.style.display = "block"
            }, 5000)
        })
    </script>
</body>

</html>
