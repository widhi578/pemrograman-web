<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Interaktif</title>
    <style>
        :root {
            --background-color: rgb(233, 233, 88);
            --primary-color: #4A90E2;
            --secondary-font-size: 16px;
        }

        input {
            width: 40px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            padding: 80px;
            background-color: var(--background-color);
        }

        .btn {
            padding: 12px 24px;
            font-size: var(--secondary-font-size);
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 1s ease-in 0.1s;
            animation: blup 1s linear infinite;
        }

        .btn:active {
            background-color: #000000;
            transform: translateY(-10px);
            box-shadow: 0 12px 8px rgba(0, 0, 0, 0.15);
        }

        
        .card {
            max-width: 300px;
            margin-top: 30px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            transition: all 1s ease;
            animation: muncul 1s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 8px rgba(0, 0, 0, 0.15);
        }
        
        
        .spinner {
            margin-top: 50px;
            width: 100px;
            height: 100px;
            border: 10px solid #ddd;
            border-top: 10px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes blup {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

    </style>
</head>

<body>
    <input type="text">

    <!-- <button class="btn">Click Me</button> -->

    <div class="card">
        <h3>Judul Produk</h3>
        <p>Deskripsi singkat produk di sini.</p>
    </div>

    <div class="spinner"></div>
</body>

</html>
