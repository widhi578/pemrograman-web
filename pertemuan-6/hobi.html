<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hobi</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #1e293b;
    background: #f1f5f9;
  }

  header {
    padding: 42px 24px;
    text-align: center;
    color: white;
    background: linear-gradient(120deg, #34487C, #3E5DB7);
  }

  header h2 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3rem);
  }

  section {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 24px;
    max-width: 1100px;
    margin: 32px auto;
    padding: 0 24px;
  }

  nav,
  article {
    border-radius: 16px;
    box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
  }

  nav {
    padding: 18px;
    background: #1D263E;
  }

  nav ul {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  nav a {
    display: block;
    padding: 12px 14px;
    color: #cbd5e1;
    text-decoration: none;
    border-radius: 8px;
    transition: background-color 0.2s, color 0.2s;
  }

  nav a:hover {
    color: white;
    background: #1e40af;
  }

  article {
    min-height: 420px;
    padding: 32px;
    background: white;
  }

  article h1 {
    margin: 0 0 14px;
    color: #0f172a;
    font-size: 2rem;
  }

  article p {
    max-width: 680px;
    margin: 0 0 22px;
    line-height: 1.8;
  }

  .image {
    display: flex;
    gap: 12px;
  }

  .image img {
    width: calc((100% - 24px) / 3);
    height: 160px;
    object-fit: cover;
    border-radius: 10px;
    box-shadow: 0 6px 14px rgba(15, 23, 42, 0.14);
  }

  footer {
    padding: 18px 24px;
    text-align: center;
    color: #cbd5e1;
    background: #1D263E;
  }

  footer p {
    margin: 0;
  }

  @media (max-width: 700px) {
    section {
      grid-template-columns: 1fr;
      margin: 20px auto;
      padding: 0 16px;
    }

    nav ul {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    nav a {
      padding: 9px 11px;
    }

    article {
      min-height: 0;
      padding: 24px;
    }

    .image {
      display: flex;
      flex-direction: column;
    }

    .image img {
      width: 100%;
      height: 190px;
    }
  }
</style>
</head>

<body>
    <header>
        <h2>Biodata</h2>
    </header>

    <section>
        <nav>
            <ul>
                <li><a href="./data-diri.html">Data Diri</a></li>
                <li><a href="./hobi.html">Hobi</a></li>
                <li><a href="https://smknegeri40-jkt.sch.id/" target="_blank">Sekolah</a></li>
                <li><a href="./pengalaman.html">Pengalaman</a></li>
            </ul>
        </nav>
  
        <article>
            <h1>Hobi</h1>
            <p>Hobi saya adalah running, CTF, dan silat</p>

            <div class="image">
                <img src="./assets/run.jpeg" alt="Running">
                <img src="./assets/cyber1.png" alt="CTF Solver">
                <img src="./assets/widzz2.jpeg" alt="Silat">
            </div>
        </article>
    </section>

    <footer>
        <p>&copy; Ahmad Widhi Praditya</p>
    </footer>
</body>
</html>
